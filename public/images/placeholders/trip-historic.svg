<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.55" stop-color="#FEFCE8"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C2D12" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="0" y="560" width="1600" height="340" fill="url(#stone)"/>

  <g opacity="0.10" fill="#0F172A">
    <rect x="220" y="420" width="220" height="220" rx="24"/>
    <rect x="480" y="380" width="260" height="260" rx="28"/>
    <rect x="780" y="440" width="240" height="240" rx="26"/>
    <rect x="1060" y="395" width="320" height="320" rx="30"/>
  </g>

  <circle cx="1180" cy="220" r="120" fill="#FB7185" opacity="0.10" filter="url(#soft)"/>
  <circle cx="380" cy="240" r="150" fill="#F59E0B" opacity="0.10" filter="url(#soft)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#0F172A">
    <text x="72" y="118" font-size="44" font-weight="700" opacity="0.55">Historic route</text>
    <text x="72" y="168" font-size="22" font-weight="600" opacity="0.45">Placeholder image (demo)</text>
  </g>
</svg>
